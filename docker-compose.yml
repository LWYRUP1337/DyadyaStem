name: dyadyastem

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dyadya}:${POSTGRES_PASSWORD:-dyadya_dev}@postgres:5432/${POSTGRES_DB:-dyadyastem}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-dyadya}:${POSTGRES_PASSWORD:-dyadya_dev}@postgres:5432/${POSTGRES_DB:-dyadyastem}

x-redis-env: &redis-env
  REDIS_URL: redis://redis:6379/0

# Оставила min io но у нас garage
x-storage-env: &storage-env
  MINIO_ENDPOINT: garage:3900
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:3900}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-GK2ade727f030bfc7d6a156c42}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-d603fb8e91da1aee1509a10e04e7e9ecbc71e1d2f45a0162a1ebcbcb3ad06fe9}
  MINIO_BUCKET: ${MINIO_BUCKET:-dyadyastem}
  MINIO_SECURE: "false"
  S3_REGION: garage
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

x-limits-env: &limits-env
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  MAX_DURATION_SEC: ${MAX_DURATION_SEC:-600}

services:
  #PostgreSQL
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dyadya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dyadya_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dyadyastem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  #Redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  #Garage
  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_ALLOW_ANONYMOUS_METRICS: "false"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  garage-init:
    build: ./backend
    image: dyadyastem-backend:dev
    command: ["python", "/init_garage.py"]
    environment:
      <<: *storage-env
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev_admin_token_change_me}
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:5173},http://127.0.0.1:5173
    volumes:
      - ./infra/garage/init_garage.py:/init_garage.py:ro
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  #Backend (FastAPI)
  backend:
    build: ./backend
    image: dyadyastem-backend:dev
    environment:
      <<: [*db-env, *redis-env, *storage-env, *limits-env]
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully


  #Worker
  worker:
    build: ./worker
    mem_limit: ${WORKER_MEM_LIMIT:-5g}
    environment:
      <<: [*db-env, *redis-env, *storage-env, *limits-env]
    volumes:
      - ./worker:/app
      - torch_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A cel inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  #Frontend
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
      CHOKIDAR_USEPOLLING: "true"
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  torch_cache:
